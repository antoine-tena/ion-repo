# ion-repo's project template. Files live in template/, and only `.jinja` files are rendered (Vue,
# React and Astro templates keep their braces). A directory named `{% if … %}name{% endif %}`
# exists only when its condition holds: that is how each framework brings its files, and how
# `ion repo set` removes them when the project changes framework.
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_min_copier_version: "9.4"
# Files the project owns: ion-repo writes them once, then never touches them again. The favicons are
# binary: an update cannot merge the project's own one, it would put ion-repo's back.
_skip_if_exists:
  - CLAUDE.md
  - docs/backlog/backlog.md
  - docs/backlog/done.md
  - frontend/public/favicon.ico
  - frontend/public/favicon.svg
  - frontend/app/favicon.ico

# First question: the size of the project, four notches from tiny to large. It chooses how much
# ceremony the project gets (rules, CI, containers), and changes later with `ion repo set size=…`.
size:
  type: str
  help: How big are the stakes?
  choices:
    "Tiny: a script, a personal tool, a one-off analysis": tiny
    "Small: a small app or site, one or two people, low stakes": small
    "Medium: an app in production, real users, several contributors": medium
    "Large: several teams or services, high stakes": large
  default: small

name:
  type: str
  help: Short name of the project (lowercase letters, digits, dashes), prefix of its packages
  validator: >-
    {% if not (name | regex_search('^[a-z][a-z0-9-]*$')) %}Lowercase letters, digits and dashes only, starting with a letter.{% endif %}

title:
  type: str
  help: Title of the project, as shown to people
  default: "{{ name | replace('-', ' ') | title }}"

description:
  type: str
  help: One sentence on what the project does
  default: "{{ title }}."

# The language of the team: the conversation with Claude, the docs, commit messages, comments
# and the texts users read. Code identifiers are English whatever the answer, and so are the
# instructions ion-repo writes for Claude.
language:
  type: str
  help: Language of the team
  choices:
    English: en
    Français: fr
  default: en

language_custom:
  type: bool
  help: Set the language per use (comments, commits, docs, tickets, user-facing texts)?
  default: false

language_comments:
  type: str
  help: Language of code comments
  choices: &languages
    English: en
    Français: fr
  default: "{{ language }}"
  when: "{{ language_custom }}"

language_commits:
  type: str
  help: Language of commit messages
  choices: *languages
  default: "{{ language }}"
  when: "{{ language_custom }}"

language_docs:
  type: str
  help: Language of the docs (README, docs/)
  choices: *languages
  default: "{{ language }}"
  when: "{{ language_custom }}"

language_tickets:
  type: str
  help: Language of the tickets of docs/backlog/
  choices: *languages
  default: "{{ language }}"
  when: "{{ language_custom }}"

language_ui:
  type: str
  help: Language of the texts users read (pages, messages, figures)
  choices: *languages
  default: "{{ language }}"
  when: "{{ language_custom }}"

# ion-repo fills the owner and the team in (machine settings, else the account gh is logged in
# with); empty, the project has no team in its README. CODEOWNERS only from two people: alone,
# it would only ask the owner to review the bots' pull requests.
owner:
  type: str
  help: GitHub account or organisation that owns the repository (empty if none)
  default: ""

team:
  type: yaml
  help: GitHub logins of the team (reviewers), as a YAML list
  default: "[{{ owner }}]"

# A repo brought under ion-repo by `ion repo adopt`: the files it already had, which the template would
# have written (README.md, its own CI…), and its own code folders; neither backend nor frontend
# is then needed. ion-repo never writes them, at adoption nor at `ion repo update`. Never asked: only
# `ion repo adopt` answers it, and a repo that `ion repo new` generated does not record it.
kept:
  type: yaml
  default: "[]"
  when: "{{ kept | length > 0 }}"

# Where the backend and the front live: `backend/` and `frontend/` in a repo ion-repo generated, the
# root (`.`) in a repo adopted with its code there. Written by `ion repo adopt`, never asked; kept in
# the answers only when it differs.
backend_dir:
  type: str
  default: backend
  when: "{{ (backend_dir | default('backend')) != 'backend' }}"

frontend_dir:
  type: str
  default: frontend
  when: "{{ (frontend_dir | default('frontend')) != 'frontend' }}"

# The project type only advises: it preselects the backend and the frontend below, which stay
# free. Table of advice: ion-repo's README, "What you get".
project_type:
  type: str
  help: What are you building? (it suggests the stack)
  choices:
    "A full app (API and web interface)": app
    "An API only": api
    "A content site (showcase, documentation, blog)": site
    "A data dashboard": dashboard
    "A data analysis (notebooks, figures)": analysis
    "A command-line tool (script, workstation utility)": cli
  default: app

backend:
  type: str
  help: >-
    Backend (advised for this type:
    {% if project_type == 'app' %}Django{% elif project_type == 'api' %}FastAPI{% elif project_type in ['dashboard', 'analysis'] %}Python data{% elif project_type == 'cli' %}Python command-line tool{% else %}none{% endif %})
  choices:
    "Django + Django Ninja (full API, admin, ORM)": django
    "FastAPI (light API, async)": fastapi
    "Python data (polars, marimo, Plotly)": data
    "Python command-line tool (argparse, no server)": cli
    "Java 25 (Maven, JUnit, no framework)": java
    "None": none
  default: >-
    {% if project_type == 'app' %}django{% elif project_type == 'api' %}fastapi{% elif project_type in ['dashboard', 'analysis'] %}data{% elif project_type == 'cli' %}cli{% else %}none{% endif %}

frontend:
  type: str
  help: >-
    Frontend (advised for this type:
    {% if project_type == 'app' %}Nuxt{% elif project_type == 'site' %}Astro{% elif project_type == 'dashboard' %}Streamlit{% else %}none{% endif %})
  choices:
    "Nuxt + Vue (web app)": nuxt
    "Next.js + React (web app)": next
    "Astro (content site, static)": astro
    "Vite + React (single-page app)": vite-react
    "Streamlit (Python dashboard)": streamlit
    "Dash (Python dashboard, interactive)": dash
    "None": none
  default: >-
    {% if project_type == 'app' %}nuxt{% elif project_type == 'site' %}astro{% elif project_type == 'dashboard' %}streamlit{% else %}none{% endif %}
  validator: >-
    {% if backend == 'none' and frontend == 'none' and not kept %}A backend or a frontend is needed.{% endif %}

podman:
  type: bool
  help: Podman containers (Containerfile, compose.yaml, PostgreSQL)? Later with `ion repo set podman=true`.
  default: "{{ size in ['medium', 'large'] and not (backend in ['cli', 'java'] and frontend == 'none') }}"
  # A command-line tool, or a Java backend without a framework, has no server to put in a
  # container yet; its front, if any, does.
  validator: >-
    {% if podman and backend in ['cli', 'java'] and frontend == 'none' %}{{ 'A Java backend without a framework' if backend == 'java' else 'A command-line tool' }} alone has nothing to put in podman.{% endif %}

# A command-line tool that also ships its own Claude Code plugin: `plugins/<plugin_name>/` (manifest, a
# first skill), its catalog `.claude-plugin/marketplace.json`, enabled in the repo's own sessions.
# Later with `ion repo set claude_plugin=true`.
claude_plugin:
  type: bool
  help: Ship a Claude Code plugin with the command (skills, hooks)? Later with `ion repo set claude_plugin=true`.
  default: false
  when: "{{ backend == 'cli' }}"

# The plugin's name, what its skills are typed with (`/<plugin_name>:…`): the project's name, without
# the Ion family's `ion-` prefix. Its catalog keeps the project's name (`host@ion-host`). Later with
# `ion repo set plugin_name=<name>`.
plugin_name:
  type: str
  help: Name of the Claude Code plugin, typed `/<name>:…`. Later with `ion repo set plugin_name=<name>`.
  default: "{{ name | regex_replace('^ion-', '') }}"
  when: "{{ claude_plugin }}"
  validator: >-
    {% if claude_plugin and not (plugin_name | regex_search('^[a-z][a-z0-9-]*$')) %}Lowercase letters, digits and dashes only, starting with a letter.{% endif %}

# A command-line tool published on PyPI under this name (`.github/workflows/pypi.yml`, at each
# release tag `vX.Y.Z`); the command keeps the project's name. Empty: not published. Later with
# `ion repo set pypi_name=<name>`.
pypi_name:
  type: str
  help: Name on PyPI, if the command is published there (empty if not). Later with `ion repo set pypi_name=<name>`.
  default: ""
  when: "{{ backend == 'cli' }}"
  validator: >-
    {% if pypi_name and not (pypi_name | regex_search('^[a-z0-9]+([-_.][a-z0-9]+)*$')) %}A PyPI name: lowercase letters and digits, separated by dashes.{% endif %}

# Java: the root package of the sources (and their directories under src/main/java).
java_package:
  type: str
  help: Root package of the Java sources
  default: >-
    {% if owner %}io.github.{{ owner | lower | replace('-', '') }}{% else %}com.example{% endif %}.{{ name | replace('-', '') }}
  when: "{{ backend == 'java' }}"
  validator: >-
    {% if not (java_package | regex_search('^[a-z][a-z0-9_]*([.][a-z][a-z0-9_]*)+$')) %}A Java package: lowercase words separated by dots (com.example.app).{% endif %}

# Calendar notions (today, a day, the bounds of a period) are computed in this time zone; storage
# stays in UTC. ion-repo proposes the machine's.
timezone:
  type: str
  help: Time zone of the project's calendar notions (IANA name)
  default: UTC

# Serena (plugin serena@ion-repo): read-only symbol navigation, so that Claude Code reads a function
# rather than a whole file. Pays off on a big codebase (thousands of files); elsewhere its index
# and tool definitions cost more than they bring.
serena:
  type: bool
  help: Serena for Claude Code (symbol navigation, big codebases)? Later with `ion repo set serena=true`.
  default: false

# Claude Code compacts a conversation when its context reaches this many tokens. Every message
# re-reads the whole context, so a session left to grow to a 1M window costs several times a
# fresh one; 400000 only touches the longest sessions. 1000000: Claude Code's own default.
compact_window:
  type: int
  help: Context size, in tokens, at which Claude Code compacts a conversation (100000 to 1000000)?
  default: 400000
  validator: >-
    {% if compact_window < 100000 or compact_window > 1000000 %}Between 100000 and 1000000.{% endif %}

# Production on a server of one's own: `vps` adds config/vps/ (Caddy, production stack, switch
# with rollback, tested backups), scripts/ops/ and docs/operations/. For a Django backend, or a
# Streamlit or Dash front without an API (its own image, no database), served by podman. Later
# with `ion repo set deploy=vps`.
deploy:
  type: str
  help: Production deployment?
  choices:
    "None for now": none
    "VPS (podman, Caddy, backups)": vps
  default: none
  when: "{{ backend == 'django' or (backend in ['none', 'data', 'cli'] and frontend in ['streamlit', 'dash']) }}"
  validator: >-
    {% if deploy == 'vps' and backend != 'django' and frontend not in ['streamlit', 'dash'] %}The VPS deployment is made for a Django backend, or a Streamlit or Dash front.{% elif deploy == 'vps' and not podman %}The VPS deployment needs containers: podman=true.{% endif %}

vps_host:
  type: str
  help: SSH connection of the server (user@address)
  default: root@203.0.113.10
  when: "{{ deploy == 'vps' }}"

api_domain:
  type: str
  help: Public domain of the API (Caddy gets its TLS certificate)
  default: "api.{{ name }}.example.com"
  when: "{{ deploy == 'vps' and backend == 'django' }}"

# A server shared with other projects keeps its own ports: the stack takes these on 127.0.0.1,
# free on that server. Later with `ion repo set vps_port=… vps_db_port=…`.
vps_port:
  type: int
  help: Port of the API on the server (127.0.0.1; another one if a project already uses it)
  default: 8000
  when: "{{ deploy == 'vps' and backend == 'django' }}"

vps_db_port:
  type: int
  help: Port of the database on the server (127.0.0.1; another one if a project already uses it)
  default: 5432
  when: "{{ deploy == 'vps' and backend == 'django' }}"

site_url:
  type: str
  help: Public address of the site, allowed by CORS and checked by the smoke test
  default: "https://{{ name }}.example.com"
  when: "{{ deploy == 'vps' }}"

deploy_branch:
  type: str
  help: Branch deployed to production
  default: develop
  when: "{{ deploy == 'vps' }}"

# Nuxt front on Vercel: `vercel` adds scripts/ops/deploy-frontend.sh, which only deploys a pushed
# commit whose CI is green. Later with `ion repo set frontend_deploy=vercel`.
frontend_deploy:
  type: str
  help: Frontend deployment?
  choices:
    "None for now": none
    "Vercel": vercel
  default: none
  when: "{{ frontend == 'nuxt' }}"
  validator: >-
    {% if frontend_deploy == 'vercel' and frontend in ['streamlit', 'dash'] %}Vercel cannot host a Streamlit or Dash app: it needs a long-running Python server with websockets.{% endif %}

# Work tracking, in every repo: docs/backlog/ (skill repo:backlog).
north_star:
  type: str
  help: The goal that orders the priorities of docs/backlog/ (north star)
  default: "{{ title }} in service"

created:
  type: str
  help: Date the tracking starts (YYYY-MM-DD)
  default: "{{ '%Y-%m-%d' | strftime }}"

# Where the CI of each push runs. A private repo on GitHub's free plan has 2,000 minutes a
# month (a macOS minute counts ten): its CI runs on the machine, `ion repo ci`, verdict kept as a git
# note. A public repo runs on GitHub, free and unlimited. `ion repo new` and `ion repo update` pick it
# from the repo's visibility when the answer is missing.
ci_runner:
  type: str
  help: Where does the CI of each push run?
  choices:
    "On this machine, with ion repo ci (no GitHub minutes: a private repo)": local
    "On GitHub (free and unlimited for a public repo)": github
  default: local

# kiln-bot (ion-repo#T-59): `ion repo update` then `ion repo fix` as one pull request, on a schedule. Off by
# default: on a private repo each run spends GitHub minutes. Set with `ion repo set update_bot=weekly`.
update_bot:
  type: str
  help: kiln-bot, the grid's fixes and ion-repo's updates as a pull request?
  choices:
    "Off": "off"
    "Every Monday": weekly
    "On the 1st of each month": monthly
  default: "off"
  when: "{{ (update_bot | default('off')) != 'off' }}"

# Heavy files the repo keeps on purpose (a site's film, a model's weights), by their exact path
# from the root: pre-commit's 1 MB ceiling lets them through, and only them. Set with
# `ion repo set large_files=frontend/public/film.mp4,…`, never asked; kept in the answers when set.
large_files:
  type: yaml
  default: "[]"
  when: "{{ large_files | length > 0 }}"

# Claude Code's status line (ion-repo plugin): settings set as `git config statusline.*` by
# `ion repo install`, `ion repo new` and `ion repo set`, never by hand.
statusline_ci:
  type: bool
  help: Show the state of CI in Claude Code's status line?
  default: true

prod_health_url:
  type: str
  help: >-
    Health probe of production, answering {"version": "<sha>"} (empty when there is no
    production); the status line shows "prod ✓" or how far behind it is
  default: ""

# Path separator for directories built from a dotted name (the Java package): a path written in
# the template cannot hold a "/" inside its braces.
path_separator:
  type: str
  default: "/"
  when: false
