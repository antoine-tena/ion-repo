name: Mutation tests

# mutmut on a Django backend managed by uv, PostgreSQL and Redis run by podman ([tool.mutmut] of
# pyproject.toml): a mutant that survives is a missing test. Never blocking: the job succeeds
# whatever the score and publishes the report (statistics, survivors and their diff) as an
# artifact.
on:
  workflow_call:
    inputs:
      directory:
        description: Directory of the Django project
        type: string
        default: backend
      database:
        description: Name of the test database
        type: string
        default: app
      base:
        description: "Name before kiln 0.4.0 of `database` (kept for callers at develop)"
        type: string
        default: ""
      postgres:
        description: PostgreSQL image of the tests
        type: string
        default: docker.io/library/postgres:16-alpine
      group:
        description: uv dependency group that brings mutmut
        type: string
        default: mutation
      env:
        description: Project variables, one per line (KEY=value)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    continue-on-error: true
    defaults:
      run:
        working-directory: ./${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kiln at the exact version of this workflow, for its actions (removed at once, so that
      # the project's checks never see it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: antoine-tena/kiln
          ref: ${{ job.workflow_sha || 'develop' }}
          path: .kiln
      - uses: ./.kiln/actions/services
        with:
          database: ${{ inputs.base || inputs.database }}
          postgres: ${{ inputs.postgres }}
          redis: docker.io/library/redis:7-alpine
      - name: Remove kiln from the project directory
        run: rm -rf .kiln

      - name: Project variables
        if: inputs.env != ''
        env:
          VARIABLES: ${{ inputs.env }}
        run: printf '%s\n' "$VARIABLES" | grep -v '^\s*$' >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          package-directory: ./${{ inputs.directory }}

      - name: Dependencies
        env:
          GROUP: ${{ inputs.group }}
        run: uv sync --locked --group "$GROUP"

      # --max-children 1: each mutant runs pytest again on the same test database (--reuse-db).
      - name: mutmut
        run: uv run mutmut run --max-children 1 || echo "::warning::mutmut stopped before the end"

      - name: Report
        if: always()
        run: |
          mkdir -p ../mutation-report
          uv run mutmut export-cicd-stats || true
          cp mutants/mutmut-cicd-stats.json ../mutation-report/ 2>/dev/null || true
          uv run mutmut results --all true > ../mutation-report/mutants.txt 2>&1 || true
          grep -E ': (survived|no tests|timeout|suspicious)$' ../mutation-report/mutants.txt \
            > ../mutation-report/survivors.txt || true
          while read -r name _; do
            uv run mutmut show "${name%:}" >> ../mutation-report/survivors.diff 2>&1 || true
          done < ../mutation-report/survivors.txt
          {
            echo "## Mutation tests"
            echo
            echo '```json'
            cat ../mutation-report/mutmut-cicd-stats.json 2>/dev/null || echo "{}"
            echo '```'
            echo
            echo "Survivors: $(wc -l < ../mutation-report/survivors.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: mutation-report/
          retention-days: 90
