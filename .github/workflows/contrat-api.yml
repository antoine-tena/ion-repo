name: API contract (former name)

# Name of api-contract.yml before kiln 0.4.0, with its inputs of that time, kept for the repos
# that call kiln's workflows at `develop`. Runs api-contract.yml at this same commit.
on:
  workflow_call:
    inputs:
      back:
        type: string
        default: backend
      front:
        type: string
        default: frontend
      export:
        type: string
        default: uv run python manage.py export_openapi --check --output ../openapi.json
      generation:
        type: string
        default: pnpm generate:api
      env:
        type: string
        default: ""

jobs:
  contract:
    uses: ./.github/workflows/api-contract.yml
    with:
      backend: ${{ inputs.back }}
      frontend: ${{ inputs.front }}
      export: ${{ inputs.export }}
      generate: ${{ inputs.generation }}
      env: ${{ inputs.env }}
