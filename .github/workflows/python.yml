name: Python

# Quality of a Python project managed by uv, whatever its framework (FastAPI, data, Streamlit,
# Dash): ruff, mypy (strict configuration of pyproject.toml), pytest with a coverage floor.
# PostgreSQL run by podman when needed. A repo may call it several times, once per directory (a
# Python backend and a Streamlit frontend, for example).
on:
  workflow_call:
    inputs:
      directory:
        description: Directory of the uv project
        type: string
        default: backend
      database:
        description: Name of the PostgreSQL test database
        type: string
        default: app
      postgres:
        description: PostgreSQL image (empty = no database)
        type: string
        default: ""
      env:
        description: Project variables for every step, one per line (KEY=value)
        type: string
        default: ""
      mypy:
        description: Run mypy in the directory
        type: boolean
        default: true
      coverage-floor:
        description: Minimum line coverage, in percent (0 = no floor)
        type: number
        default: 80

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ion-repo at the exact version of this workflow, for its actions (removed at once, so that
      # the project's checks never see it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: antoine-tena/ion-repo
          ref: ${{ job.workflow_sha || 'develop' }}
          path: .ion-repo
      - uses: ./.ion-repo/actions/services
        if: inputs.postgres != ''
        with:
          database: ${{ inputs.database }}
          postgres: ${{ inputs.postgres }}
      - name: Remove ion-repo from the project directory
        run: rm -rf .ion-repo

      - name: Project variables
        if: inputs.env != ''
        env:
          VARIABLES: ${{ inputs.env }}
        run: printf '%s\n' "$VARIABLES" | grep -v '^\s*$' >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          package-directory: ./${{ inputs.directory }}

      - name: Dependencies
        run: uv sync --locked
        working-directory: ./${{ inputs.directory }}

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: ./${{ inputs.directory }}

      - name: mypy
        if: inputs.mypy
        run: uv run mypy .
        working-directory: ./${{ inputs.directory }}

      - name: pytest
        run: >-
          uv run pytest --cov --cov-branch --cov-report=xml --cov-report=term:skip-covered
          --cov-fail-under=${{ inputs.coverage-floor }}
        working-directory: ./${{ inputs.directory }}

      - name: Publish the coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.directory }}-coverage
          path: ${{ inputs.directory }}/coverage.xml
          if-no-files-found: ignore
