name: Maven

# Quality of a Java project built by Maven, without a framework: `./mvnw verify` compiles with
# blocking warnings, runs the JUnit tests and checks the JaCoCo coverage floor of pom.xml. Maven
# comes from the project's wrapper (pinned version and SHA-256), never from the runner.
on:
  workflow_call:
    inputs:
      directory:
        description: Directory of the Maven project
        type: string
        default: backend
      java:
        description: Version of the JDK
        type: string
        default: "25"

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java }}
          cache: maven
          cache-dependency-path: ${{ inputs.directory }}/pom.xml

      - name: mvnw verify
        run: ./mvnw -B verify
        working-directory: ./${{ inputs.directory }}

      - name: Publish the coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.directory }}-coverage
          path: ${{ inputs.directory }}/target/site/jacoco/jacoco.xml
          if-no-files-found: ignore
