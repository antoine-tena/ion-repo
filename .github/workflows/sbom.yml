name: SBOM

# CycloneDX bill of materials of the backend (environment locked by uv.lock) and of the front
# (pnpm-lock.yaml), kept 90 days as an artifact. Informative: never fails.
on:
  workflow_call:
    inputs:
      backend:
        description: Directory of the uv backend (empty = none)
        type: string
        default: backend
      frontend:
        description: Directory of the pnpm front (empty = none)
        type: string
        default: frontend

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: inputs.backend != ''
        with:
          enable-cache: true
          package-directory: ./${{ inputs.backend }}

      - name: Backend SBOM
        if: inputs.backend != ''
        run: |
          uv sync --locked --no-dev
          uv run --no-sync --with cyclonedx-bom cyclonedx-py environment .venv \
            --of JSON -o ../sbom-backend.cdx.json
        working-directory: ./${{ inputs.backend }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.frontend != ''
        with:
          node-version-file: ${{ inputs.frontend }}/.nvmrc

      - name: Front SBOM
        if: inputs.frontend != ''
        run: npx --yes @cyclonedx/cdxgen@11 -t pnpm --required-only -o ../sbom-frontend.cdx.json .
        working-directory: ./${{ inputs.frontend }}

      - name: Keep the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom-*.cdx.json
          retention-days: 90
