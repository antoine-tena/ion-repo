name: pypi

# Publishes ion-repo on PyPI at the tag of a promoted release, `vX.Y.Z`; never a candidate `-rc.N`,
# which only the internal channel follows, through GitHub. Then the GitHub Release of the tag, its notes taken
# from the tag's `CHANGELOG.md` entry (what the repo page and its watchers see), and the Homebrew
# formula of the tap (ion-repo#T-12), pushed with the deploy key in the secret `HOMEBREW_TAP_KEY`. The built
# packages carry a build provenance attestation (Sigstore, ion-repo#T-90) and are attached to the Release:
# `gh attestation verify ion_repo-X.Y.Z-py3-none-any.whl -R antoine-tena/ion-repo`.
on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ion-repo/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false  # a release: no cache to poison
      - name: Tag version = package version
        run: |
          package="$(uv version --short)"
          if [ "v${package}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME}, but pyproject.toml says ${package}"
            exit 1
          fi
      - name: Build
        run: uv build
      # The very last `kiln-cli` and `keramos-kiln`, the same code but for their name and description:
      # at its first run each moves its tester to ion-repo (`kiln_move.py`). Published at this tag
      # only (ion-repo#T-373).
      - name: Build the last kiln-cli and keramos-kiln
        if: github.ref_name == 'v0.4.11'
        run: |
          for name in kiln-cli keramos-kiln; do
            sed -i "s/^name = \"ion-repo\"\$/name = \"${name}\"/" pyproject.toml
            grep -q "^name = \"${name}\"\$" pyproject.toml
            sed -i 's/^description = .*/description = "Last release: kiln is now ion-repo. Run kiln once to move, or: uv tool install ion-repo"/' pyproject.toml
            uv build
            git checkout -- pyproject.toml
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      # The family's token, in the `pypi` environment ("Entire account" until the project exists:
      # ion's `.pypi/config`). A file already on PyPI is skipped, so a failed run can be rerun.
      - name: Publish ion-repo
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.KERAMOS_PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/ion_repo-*
      - name: Publish the last keramos-kiln
        if: github.ref_name == 'v0.4.11'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.KERAMOS_PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/keramos_kiln-*
      # After ion-repo, on purpose: this release moves its testers there. PYPI_TOKEN is scoped to
      # kiln-cli.
      - name: Publish the last kiln-cli
        if: github.ref_name == 'v0.4.11'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/kiln_cli-*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## v${version} — " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no ${GITHUB_REF_NAME} entry in CHANGELOG.md"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/* --title "ion-repo ${GITHUB_REF_NAME}"
          --notes-file notes.md --verify-tag

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false  # a release: no cache to poison
      - name: Formula
        run: uv run --no-project python scripts/homebrew_formula.py "${GITHUB_REF_NAME}" > ion-repo.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the push to the tap needs its key kept
          repository: antoine-tena/homebrew-ion
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
      - name: Push to the tap
        run: |
          mkdir -p tap/Formula
          mv ion-repo.rb tap/Formula/ion-repo.rb
          cd tap
          # `brew upgrade kiln` follows the rename: https://docs.brew.sh/Rename-A-Formula
          git rm -q --ignore-unmatch Formula/kiln.rb
          echo '{ "kiln": "ion-repo" }' > formula_renames.json
          git add Formula/ion-repo.rb formula_renames.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "ion-repo ${GITHUB_REF_NAME}"
          git push
