name: pypi

# Publishes kiln on PyPI (package kiln-cli) at the tag of a promoted release, `vX.Y.Z`; never a
# candidate `-rc.N`, which only the internal channel follows, through GitHub. PyPI token in the
# secret `PYPI_TOKEN` of the `pypi` environment (set from `.pypi/token`); without it, trusted
# publishing if PyPI trusts this workflow. Then the GitHub Release of the tag, its notes taken
# from the tag's `CHANGELOG.md` entry (what the repo page and its watchers see), and the Homebrew
# formula of the tap (T-12), pushed with the deploy key in the secret `HOMEBREW_TAP_KEY`.
on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kiln-cli/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Tag version = package version
        run: |
          package="$(uv version --short)"
          if [ "v${package}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME}, but pyproject.toml says ${package}"
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --trusted-publishing automatic

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## v${version} — " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no ${GITHUB_REF_NAME} entry in CHANGELOG.md"
            exit 1
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "kiln ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Formula
        run: uv run --no-project python scripts/homebrew_formula.py "${GITHUB_REF_NAME}" > kiln.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: antoine-tena/kiln-homebrew
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
      - name: Push to the tap
        run: |
          mkdir -p tap/Formula
          mv kiln.rb tap/Formula/kiln.rb
          cd tap
          git add Formula/kiln.rb
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "kiln ${GITHUB_REF_NAME}"
          git push
