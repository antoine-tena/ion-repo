name: pypi

# Publishes kiln on PyPI (package kiln-cli) at the tag of a promoted release, `vX.Y.Z`; never a
# candidate `-rc.N`, which only the internal channel follows, through GitHub. PyPI token in the
# secret `PYPI_TOKEN` of the `pypi` environment (set from `.pypi/token`); without it, trusted
# publishing if PyPI trusts this workflow. Then the GitHub Release of the tag, its notes taken
# from the tag's `CHANGELOG.md` entry (what the repo page and its watchers see), and the Homebrew
# formula of the tap (T-12), pushed with the deploy key in the secret `HOMEBREW_TAP_KEY`. The built
# packages carry a build provenance attestation (Sigstore, T-90) and are attached to the Release:
# `gh attestation verify kiln_cli-X.Y.Z-py3-none-any.whl -R antoine-tena/kiln`.
on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kiln-cli/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false  # a release: no cache to poison
      - name: Tag version = package version
        run: |
          package="$(uv version --short)"
          if [ "v${package}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME}, but pyproject.toml says ${package}"
            exit 1
          fi
      - name: Build
        run: uv build
      # The same code under the Keramos family's name, `keramos-kiln`, which replaces kiln-cli
      # once the testers have moved: only the distribution's name differs.
      - name: Build keramos-kiln
        run: |
          sed -i 's/^name = "kiln-cli"$/name = "keramos-kiln"/' pyproject.toml
          grep -q '^name = "keramos-kiln"$' pyproject.toml
          uv build
          git checkout -- pyproject.toml
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - name: Publish kiln-cli
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --trusted-publishing automatic dist/kiln_cli-*
      # PYPI_TOKEN is scoped to kiln-cli: keramos-kiln has the Keramos family's token
      # (`KERAMOS_PYPI_TOKEN`, "Entire account" until the project exists), otherwise trusted
      # publishing if PyPI trusts this workflow.
      - name: Publish keramos-kiln
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.KERAMOS_PYPI_TOKEN }}
        run: uv publish --trusted-publishing automatic dist/keramos_kiln-*

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## v${version} — " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no ${GITHUB_REF_NAME} entry in CHANGELOG.md"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/* --title "kiln ${GITHUB_REF_NAME}"
          --notes-file notes.md --verify-tag

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false  # a release: no cache to poison
      - name: Formula
        run: uv run --no-project python scripts/homebrew_formula.py "${GITHUB_REF_NAME}" > kiln.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the push to the tap needs its key kept
          repository: antoine-tena/homebrew-kiln
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
          path: tap
      - name: Push to the tap
        run: |
          mkdir -p tap/Formula
          mv kiln.rb tap/Formula/kiln.rb
          cd tap
          git add Formula/kiln.rb
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "kiln ${GITHUB_REF_NAME}"
          git push
