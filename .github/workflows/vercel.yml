name: Vercel

# Production deployment of the front: build on the runner, then upload of the result alone
# (--prebuilt), so that no file outside the Vercel project can leave.
# Secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID: those of the GitHub environment
# `environment`, which the job reads directly (a caller cannot pass environment secrets), or
# those of the repo passed with `secrets: inherit`.
on:
  workflow_call:
    inputs:
      frontend:
        description: Directory of the front (for the Node version, .nvmrc)
        type: string
        default: frontend
      environment:
        description: GitHub environment, subject to approval
        type: string
        default: production

jobs:
  vercel:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.frontend }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.frontend }}/.nvmrc

      - name: Build and deploy on Vercel
        run: |
          pnpm dlx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel build --prod --token="$VERCEL_TOKEN"
          url="$(pnpm dlx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Front deployed: $url (\`$GITHUB_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
