name: API contract

# The front calls the API through a client typed from openapi.json: this job generates the schema
# again from the Django code (django-ninja), then the types from the schema, and fails if one of
# the committed files drifted. Generated files are those of .gitattributes (linguist-generated).
# A second job compares the schema with the one production serves (oasdiff, run by podman) and
# fails on a broken route: one removed, a field made required, a type changed.
on:
  workflow_call:
    inputs:
      backend:
        description: Directory of the Django backend
        type: string
        default: backend
      frontend:
        description: Directory of the pnpm front
        type: string
        default: frontend
      export:
        description: Command that checks openapi.json against the code, from the backend
        type: string
        default: uv run python manage.py export_openapi --check --output ../openapi.json
      generate:
        description: Command that generates the front's types, from the front
        type: string
        default: pnpm generate:api
      schema:
        description: The committed schema, from the root
        type: string
        default: openapi.json
      breaking-base:
        description: Branch whose schema a change may not break (production's); empty = no check
        type: string
        default: main
      env:
        description: Project variables, one per line (KEY=value)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Project variables
        if: inputs.env != ''
        env:
          VARIABLES: ${{ inputs.env }}
        run: printf '%s\n' "$VARIABLES" | grep -v '^\s*$' >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          package-directory: ./${{ inputs.backend }}

      - name: Backend dependencies
        run: uv sync --locked
        working-directory: ./${{ inputs.backend }}

      - name: openapi.json matches the code
        env:
          EXPORT: ${{ inputs.export }}
        run: bash -eo pipefail -c "$EXPORT"
        working-directory: ./${{ inputs.backend }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.frontend }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.frontend }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.frontend }}/pnpm-lock.yaml

      - name: Front dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
        working-directory: ./${{ inputs.frontend }}

      - name: Types and input rules match the schema
        env:
          GENERATE: ${{ inputs.generate }}
        run: |
          $GENERATE
          git diff --exit-code -- ':(top,attr:linguist-generated=true)' \
            || (echo "::error::Generated files drifted from the schema. Run '$GENERATE'." && exit 1)
        working-directory: ./${{ inputs.frontend }}

  breaking:
    if: inputs.breaking-base != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: No route broken against the base branch
        env:
          BASE: ${{ inputs.breaking-base }}
          SCHEMA: ${{ inputs.schema }}
        run: |
          if ! git show "origin/$BASE:$SCHEMA" > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            echo "::notice::No $SCHEMA on $BASE yet: nothing to compare."
            exit 0
          fi
          podman run --rm -v "$RUNNER_TEMP/base.json:/specs/base.json:ro" \
            -v "$PWD/$SCHEMA:/specs/head.json:ro" \
            docker.io/tufin/oasdiff:v1.39.0@sha256:d552b750fa6adcc7787c7d8f656d4a9c2a9768a46cfcd9b68ec7191ca583ea1e \
            breaking /specs/base.json /specs/head.json --fail-on ERR
