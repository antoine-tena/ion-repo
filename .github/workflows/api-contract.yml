name: API contract

# The front calls the API through a client typed from openapi.json: this job generates the schema
# again from the Django code (django-ninja), then the types from the schema, and fails if one of
# the committed files drifted. Generated files are those of .gitattributes (linguist-generated).
on:
  workflow_call:
    inputs:
      backend:
        description: Directory of the Django backend
        type: string
        default: backend
      frontend:
        description: Directory of the pnpm front
        type: string
        default: frontend
      export:
        description: Command that checks openapi.json against the code, from the backend
        type: string
        default: uv run python manage.py export_openapi --check --output ../openapi.json
      generate:
        description: Command that generates the front's types, from the front
        type: string
        default: pnpm generate:api
      env:
        description: Project variables, one per line (KEY=value)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Project variables
        if: inputs.env != ''
        env:
          VARIABLES: ${{ inputs.env }}
        run: printf '%s\n' "$VARIABLES" | grep -v '^\s*$' >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          package-directory: ./${{ inputs.backend }}

      - name: Backend dependencies
        run: uv sync --locked
        working-directory: ./${{ inputs.backend }}

      - name: openapi.json matches the code
        env:
          EXPORT: ${{ inputs.export }}
        run: bash -eo pipefail -c "$EXPORT"
        working-directory: ./${{ inputs.backend }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.frontend }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.frontend }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.frontend }}/pnpm-lock.yaml

      - name: Front dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
        working-directory: ./${{ inputs.frontend }}

      - name: Types and input rules match the schema
        env:
          GENERATE: ${{ inputs.generate }}
        run: |
          $GENERATE
          git diff --exit-code -- ':(top,attr:linguist-generated=true)' \
            || (echo "::error::Generated files drifted from the schema. Run '$GENERATE'." && exit 1)
        working-directory: ./${{ inputs.frontend }}
