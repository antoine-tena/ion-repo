name: pnpm

# Quality of a pnpm front (Nuxt, Next.js, Astro…): the package.json scripts listed in `scripts`,
# one after the other (lint, typecheck, tests, build…), then the reports published as an
# artifact. The version of pnpm is that of the packageManager field of package.json.
on:
  workflow_call:
    inputs:
      directory:
        description: Directory of the front
        type: string
        default: frontend
      pnpm:
        description: Version of pnpm (empty = the packageManager field of package.json)
        type: string
        default: ""
      scripts:
        description: pnpm scripts to run in order, one per line (with their arguments)
        type: string
        default: |
          lint
          typecheck
          test
          build
      reports:
        description: Paths published as an artifact, relative to the directory, one per line
        type: string
        default: ""
      rapports:
        description: "Name before kiln 0.4.0 of `reports` (kept for callers at develop)"
        type: string
        default: ""

jobs:
  pnpm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./${{ inputs.directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm }}
          package_json_file: ${{ inputs.directory }}/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.directory }}/pnpm-lock.yaml

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          while read -r script; do
            [ -n "$script" ] || continue
            echo "::group::pnpm $script"
            # shellcheck disable=SC2086 # the script carries its arguments
            pnpm $script
            echo "::endgroup::"
          done <<< "$SCRIPTS"

      - name: Paths of the reports
        id: reports
        if: always() && (inputs.reports != '' || inputs.rapports != '')
        env:
          REPORTS: ${{ inputs.rapports || inputs.reports }}
          DIRECTORY: ${{ inputs.directory }}
        run: |
          {
            echo "paths<<END"
            while read -r path; do [ -n "$path" ] && echo "$DIRECTORY/$path"; done <<< "$REPORTS"
            echo "END"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the reports
        if: always() && (inputs.reports != '' || inputs.rapports != '')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.directory }}-reports
          path: ${{ steps.reports.outputs.paths }}
          if-no-files-found: ignore
