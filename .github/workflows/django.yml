name: Django

# Quality of a Django backend managed by uv, against real PostgreSQL and Redis (run by podman):
# without them the suite runs on SQLite (select_for_update skipped, partial constraints never
# exercised) and on a cache local to the process.
# ruff, mypy typing as a ratchet (`charter types`), missing migrations, pytest with coverage,
# coverage floors (`charter coverage`).
on:
  workflow_call:
    inputs:
      directory:
        description: Directory of the Django project
        type: string
        default: backend
      database:
        description: Name of the test database, of its user, and prefix of its password
        type: string
        default: app
      base:
        description: "Name before kiln 0.4.0 of `database` (kept for callers at develop)"
        type: string
        default: ""
      postgres:
        description: PostgreSQL image of the tests
        type: string
        default: docker.io/library/postgres:16-alpine
      redis:
        description: Redis image of the tests (empty = no Redis)
        type: string
        default: docker.io/library/redis:7-alpine
      env:
        description: Project variables for every step, one per line (KEY=value)
        type: string
        default: ""
      mypy:
        description: Run `charter types` (section [types] of charter.toml)
        type: boolean
        default: true
      coverage:
        description: Run `charter coverage` (section [coverage] of charter.toml)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # kiln at the exact version of this workflow: its actions and the charter command come
      # from there (removed at once, so that the project's checks never see it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: antoine-tena/kiln
          ref: ${{ job.workflow_sha || 'develop' }}
          path: .kiln
      - uses: ./.kiln/actions/charter
        with:
          ref: ${{ job.workflow_sha || 'develop' }}

      - uses: ./.kiln/actions/services
        with:
          database: ${{ inputs.base || inputs.database }}
          postgres: ${{ inputs.postgres }}
          redis: ${{ inputs.redis }}
      - name: Remove kiln from the project directory
        run: rm -rf .kiln

      - name: Project variables
        if: inputs.env != ''
        env:
          VARIABLES: ${{ inputs.env }}
        run: printf '%s\n' "$VARIABLES" | grep -v '^\s*$' >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          package-directory: ./${{ inputs.directory }}

      - name: Dependencies
        run: uv sync --locked
        working-directory: ./${{ inputs.directory }}

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
        working-directory: ./${{ inputs.directory }}

      - name: Typing (mypy, as a ratchet)
        if: inputs.mypy
        run: charter types

      # A model changed without `makemigrations` breaks no test (Django builds the schema from
      # the existing migrations): it only showed up at the `migrate` of the deployment.
      - name: No missing migration
        run: uv run python manage.py makemigrations --check --dry-run
        working-directory: ./${{ inputs.directory }}

      - name: pytest
        run: uv run pytest --cov --cov-branch --cov-report=xml --cov-report=term:skip-covered
        working-directory: ./${{ inputs.directory }}

      - name: Publish the coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.directory }}-coverage
          path: ${{ inputs.directory }}/coverage.xml
          if-no-files-found: ignore

      - name: Coverage floors
        if: inputs.coverage
        run: charter coverage
