name: Dependency security

# Fails as long as a dependency known to be vulnerable stays in place: `uv audit` for each uv
# project, `pnpm audit` for each pnpm front, OSV-Scanner for a Maven project. Upgrades go through
# Dependabot and `ion repo update`; GitHub's security alerts stay on.
on:
  workflow_call:
    inputs:
      uv:
        description: Directories of the uv projects, separated by spaces (empty = none)
        type: string
        default: backend
      pnpm:
        description: Directory of the pnpm front (empty = none)
        type: string
        default: frontend
      pnpm-version:
        description: Version of pnpm (empty = the packageManager field of package.json)
        type: string
        default: ""
      maven:
        description: Directory of the Maven project, audited by OSV-Scanner (empty = none)
        type: string
        default: ""
      audit-level:
        description: Lowest severity that makes pnpm audit fail
        type: string
        default: high

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: inputs.uv != ''

      - name: uv audit
        if: inputs.uv != ''
        env:
          DIRECTORIES: ${{ inputs.uv }}
        run: |
          for directory in $DIRECTORIES; do
            echo "::group::uv audit $directory"
            (cd "$directory" && uv audit --locked --preview-features audit-command)
            echo "::endgroup::"
          done

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: always() && inputs.pnpm != ''
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: ${{ inputs.pnpm }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always() && inputs.pnpm != ''
        with:
          node-version-file: ${{ inputs.pnpm }}/.nvmrc

      - name: pnpm audit
        if: always() && inputs.pnpm != ''
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: pnpm audit --prod --audit-level "$AUDIT_LEVEL"
        working-directory: ./${{ inputs.pnpm }}

      - name: OSV-Scanner (Maven)
        if: always() && inputs.maven != ''
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            ./${{ inputs.maven }}
