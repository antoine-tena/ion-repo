name: Tauri

# A Tauri desktop app built natively on each system it ships for (Windows and macOS by default):
# its Rust core formatted, linted by Clippy and tested, then its installers built by `tauri build`
# and published as artifacts. Rust comes from the project's `rust-toolchain.toml`, through the
# rustup of GitHub's runners; pnpm from the packageManager field of package.json. A macOS minute
# counts ten on a private repo: this runs at release, and by hand.
on:
  workflow_call:
    inputs:
      directory:
        description: Directory of the app (its package.json, and src-tauri/ inside)
        type: string
        default: frontend
      runners:
        description: GitHub runners to build on, as a JSON list
        type: string
        default: '["windows-latest", "macos-latest"]'

permissions:
  contents: read

jobs:
  tauri:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ./${{ inputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: ${{ inputs.directory }}/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.directory }}/.nvmrc
          cache: pnpm
          cache-dependency-path: ${{ inputs.directory }}/pnpm-lock.yaml

      - name: WebKitGTK (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Rust toolchain
        working-directory: ./${{ inputs.directory }}/src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.directory }}/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles(format('{0}/src-tauri/Cargo.lock', inputs.directory), format('{0}/src-tauri/rust-toolchain.toml', inputs.directory)) }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Rust core (rustfmt, Clippy, tests)
        working-directory: ./${{ inputs.directory }}/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Installers
        run: pnpm tauri build

      - name: Publish the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: |
            ${{ inputs.directory }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ inputs.directory }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ inputs.directory }}/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
