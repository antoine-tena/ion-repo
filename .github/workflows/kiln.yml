name: kiln

# Checks of kiln itself: ruff, mypy, the test suite (every stack combination is rendered), on
# Linux and macOS, with the end-to-end tests (every framework generated, installed and checked;
# projects of earlier releases updated to this one). Only on release branches, the way to
# `main`, and on demand: a merge into develop runs fast linters only (choice of antoine,
# 21 October 2026).
on:
  push:
    branches: [ "release/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiln:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Dependencies
        run: uv sync --locked
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      # A tool that grades other repos scores 100 on its own grid, or the release waits (T-90).
      - name: kiln score
        run: |
          uv run kiln score
          uv run kiln score --json | uv run python -c 'import json, sys; sys.exit(json.load(sys.stdin)["score"] != 100)'

  e2e:
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Earlier releases are rendered from their tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pnpm
        run: corepack enable pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - name: Dependencies
        run: uv sync --locked
      - name: End-to-end tests
        # Ubuntu 26's /tmp is a tmpfs with a quota: the generated projects go on the disk.
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run pytest -m e2e -n 4 -q
