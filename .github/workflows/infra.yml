name: Infra

# What used to be checked only on the server, at the worst moment: container images (podman),
# GitHub workflows (actionlint), shell scripts (shellcheck), Caddyfile and compose stack.
# Never docker: podman builds and runs, podman-compose (installed by uv) reads the compose file.
on:
  workflow_call:
    inputs:
      image:
        description: Directories of the images to build (context and Containerfile), space-separated
        type: string
        default: ""
      containerfiles:
        description: Containerfiles built from the root of the repo, space-separated
        type: string
        default: ""
      shellcheck:
        description: Patterns of the scripts to check, space-separated (empty = none)
        type: string
        default: ""
      caddyfile:
        description: Caddyfile to validate (empty = none)
        type: string
        default: ""
      compose:
        description: Compose file to validate (empty = none)
        type: string
        default: ""
      setup:
        description: Commands run before validating the compose file (files it expects…)
        type: string
        default: ""
      preparation:
        description: "Name before kiln 0.4.0 of `setup` (kept for callers at develop)"
        type: string
        default: ""
      env:
        description: Variables for the compose validation, one per line (KEY=value)
        type: string
        default: ""

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Images (podman)
        if: inputs.image != ''
        env:
          DIRECTORIES: ${{ inputs.image }}
        run: |
          for directory in $DIRECTORIES; do
            echo "::group::podman build $directory"
            podman build --pull -t "ci-${GITHUB_RUN_ID}-$(basename "$directory")" "$directory"
            echo "::endgroup::"
          done

      - name: Images from the root (podman)
        if: inputs.containerfiles != ''
        env:
          CONTAINERFILES: ${{ inputs.containerfiles }}
        run: |
          for containerfile in $CONTAINERFILES; do
            echo "::group::podman build -f $containerfile ."
            tag="ci-${GITHUB_RUN_ID}-$(dirname "$containerfile")"
            podman build --pull -f "$containerfile" -t "$tag" .
            echo "::endgroup::"
          done

      # A bare ":" in a `run:` once made a workflow unreadable without anything saying so.
      # The shell of the `run:` steps is not checked here; scripts are, by the next step.
      - name: actionlint (GitHub workflows)
        run: uvx --from actionlint-py actionlint -color -shellcheck= -pyflakes=

      - name: shellcheck
        if: inputs.shellcheck != ''
        env:
          PATTERNS: ${{ inputs.shellcheck }}
        run: |
          # shellcheck disable=SC2086 # patterns expanded by the shell
          uvx --from shellcheck-py shellcheck $PATTERNS

      - name: Caddyfile
        if: inputs.caddyfile != ''
        run: |
          podman run --rm -v "$PWD/${{ inputs.caddyfile }}:/etc/caddy/Caddyfile:ro,Z" \
            docker.io/library/caddy:2 \
            sh -c 'mkdir -p /var/log/caddy && caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile'

      - name: Compose stack
        if: inputs.compose != ''
        env:
          SETUP: ${{ inputs.preparation || inputs.setup }}
          VARIABLES: ${{ inputs.env }}
        run: |
          [ -z "$SETUP" ] || bash -c "$SETUP"
          set -a
          eval "$(printf '%s\n' "$VARIABLES" | grep -v '^\s*$')"
          set +a
          uvx podman-compose -f "${{ inputs.compose }}" config > /dev/null
