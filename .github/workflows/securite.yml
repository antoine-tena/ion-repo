name: Dependency security (former name)

# Name of security.yml before kiln 0.4.0, with its inputs of that time, kept for the repos that
# call kiln's workflows at `develop`. Runs security.yml at this same commit.
on:
  workflow_call:
    inputs:
      uv:
        type: string
        default: backend
      pnpm:
        type: string
        default: frontend
      version-pnpm:
        type: string
        default: ""
      niveau:
        type: string
        default: high

permissions:
  contents: read

jobs:
  audit:
    uses: ./.github/workflows/security.yml
    with:
      uv: ${{ inputs.uv }}
      pnpm: ${{ inputs.pnpm }}
      pnpm-version: ${{ inputs.version-pnpm }}
      audit-level: ${{ inputs.niveau }}
