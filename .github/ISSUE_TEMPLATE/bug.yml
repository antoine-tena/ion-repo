name: Bug report
description: Something in ion-repo, a generated repo or a workflow does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The relevant output. `ION_REPO_VERBOSE=1 ion-repo …` shows the full output of each step.
      render: shell
  - type: input
    id: version
    attributes:
      label: ion repo version
      description: The `ion-repo` line of `ion repo doctor` and, in a generated repo, its `modèle` line (template version).
  - type: input
    id: stack
    attributes:
      label: Stack
      description: "Backend / frontend / podman, e.g. `django + nuxt, podman`, or `n/a`."
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Linux, WSL, macOS, Other]
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: For a skill, hook or status line problem, `claude --version`.
