version: 2
updates:
  - package-ecosystem: uv
    directories:
      - "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/actions/charte"
      - "/actions/charter"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
