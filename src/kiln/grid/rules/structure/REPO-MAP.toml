id = "REPO-MAP"
title = "The repo's docs hold a map of it: where each thing lives"
pillar = "readability"
theme = "structure"
scope = { kind = "universal" }
level = "adopt"
regime = "review"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A map read first saves every reader, and every agent, a search through the tree."
applies = []
detectable = "approximate"
fixable = "judgment"
fixer = ""
since = "0.4.1"

[detector]
kind = "regex"
# A map is a human practice first (matklad's ARCHITECTURE.md, 2021), an agent's file next.
files = ["README.md", "CONTRIBUTING.md", "ARCHITECTURE.md", "docs/ARCHITECTURE.md", "CLAUDE.md", "AGENTS.md"]
pattern = '''(?im)^#+\s.*\b(map|layout|structure|architecture|organi[sz]ation|carte|arborescence)\b'''
expect = "match"

[[sources]]
url = "https://code.claude.com/docs/en/memory"
kind = "docs"
checked = 2026-10-20

[[sources]]
url = "https://agents.md/"
kind = "adoption"
checked = 2026-10-20

[[sources]]
url = "https://matklad.github.io/2021/02/06/ARCHITECTURE.md.html"
kind = "blog"
checked = 2026-10-26
