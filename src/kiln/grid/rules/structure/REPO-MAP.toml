id = "REPO-MAP"
title = "The root instructions hold a map of the repo: where each thing lives"
pillar = "readability"
theme = "structure"
scope = { kind = "universal" }
level = "adopt"
regime = "review"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A map read first saves every reader, and every agent, a search through the tree."
applies = []
detectable = "approximate"
fixable = "judgment"
fixer = ""
since = "0.4.1"

[detector]
kind = "regex"
files = ["CLAUDE.md", "AGENTS.md"]
pattern = '''(?im)^#+\s.*\b(map|layout|structure|carte|arborescence)\b'''
expect = "match"

