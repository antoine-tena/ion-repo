id = "DJANGO-ALLOWED-HOSTS"
title = "`ALLOWED_HOSTS` names the hosts, never `*`"
pillar = "methods"
theme = "app-security"
scope = { kind = "framework", name = "django" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A wildcard lets a forged Host header poison password reset links and caches."
applies = ["django"]
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.2"

[detector]
kind = "regex"
files = ["**/settings.py", "**/settings/base.py", "**/settings/prod.py", "**/settings/production.py"]
pattern = '''(?m)^ALLOWED_HOSTS\s*=\s*\[\s*[\"']\*[\"']\s*,?\s*\]'''

[[sources]]
url = "https://docs.djangoproject.com/en/stable/ref/settings/#allowed-hosts"
kind = "docs"
checked = 2026-10-20
