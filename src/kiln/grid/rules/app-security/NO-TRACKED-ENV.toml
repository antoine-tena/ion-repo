id = "NO-TRACKED-ENV"
title = "No environment file with secrets committed"
pillar = "methods"
theme = "app-security"
scope = { kind = "universal" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A repo should be publishable at any moment without leaking a credential; a committed .env leaks them all."
applies = []
fixer = ""
since = "0.4.1"
charter_rule = "SECRETS"

[detector]
kind = "file"
paths = ["**/.env", "**/.env.local", "**/.env.production", "**/.env.*.local"]
expect = "absent"

[[sources]]
url = "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
kind = "advisory"
checked = 2026-10-19

[[sources]]
url = "https://12factor.net/config"
kind = "blog"
checked = 2026-10-19
