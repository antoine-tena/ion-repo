id = "PINNED-ACTIONS"
title = "GitHub Actions and reusable workflows pinned to a full commit SHA"
pillar = "methods"
theme = "supply-chain"
scope = { kind = "tool", name = "github-actions" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A tag can be moved to other code at any time; a full commit SHA cannot."
applies = ["github-actions"]
fixer = ""
since = "0.4.1"

[detector]
kind = "regex"
files = [".github/workflows/*.yml", ".github/workflows/*.yaml", "**/action.yml", "**/action.yaml"]
# `uses: owner/repo@ref` whose ref is not 40 hex characters; local actions and images aside.
pattern = '''^\s*-?\s*uses:\s*['"]?(?!\./|docker://)[^@\s'"]+@(?![0-9a-f]{40}\b)'''
expect = "none"

[[sources]]
url = "https://docs.github.com/en/actions/reference/security/secure-use"
kind = "docs"
checked = 2026-10-19
