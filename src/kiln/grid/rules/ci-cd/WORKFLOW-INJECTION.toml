id = "WORKFLOW-INJECTION"
title = "No untrusted event text expanded inside a workflow script"
pillar = "methods"
theme = "ci-cd"
scope = { kind = "tool", name = "github-actions" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A pull request title is attacker-controlled: expanded into `run:`, it becomes code with the workflow's secrets."
applies = ["github-actions"]
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.2"

[detector]
kind = "regex"
files = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
pattern = '''\$\{\{\s*github\.(head_ref|event\.(issue|pull_request|comment|review|review_comment|discussion|head_commit|commits|pages)\S*\.(title|body|message|name|email|label|ref|head_ref|default_branch))'''

[[sources]]
url = "https://securitylab.github.com/resources/github-actions-untrusted-input/"
kind = "advisory"
checked = 2026-10-20

[[sources]]
url = "https://docs.github.com/en/actions/reference/security/secure-use"
kind = "docs"
checked = 2026-10-20
