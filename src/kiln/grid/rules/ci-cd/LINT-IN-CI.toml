id = "LINT-IN-CI"
title = "The CI runs the linter"
pillar = "standards"
theme = "ci-cd"
scope = { kind = "universal" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A rule only the author's editor checks is a suggestion."
applies = []
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.2"

[detector]
kind = "regex"
files = [".github/workflows/*.yml", ".github/workflows/*.yaml", ".gitlab-ci.yml", ".pre-commit-config.yaml", ".pre-commit-config.yml", ".circleci/config.yml", ".forgejo/workflows/*.yml", "azure-pipelines.yml", "bitbucket-pipelines.yml", "Jenkinsfile"]
pattern = '''(ruff|flake8|pylint|eslint|biome|oxlint|(npm|pnpm|yarn|bun) (run )?lint|kiln check|charter|antoine-tena/kiln/\.github/workflows/(django|python|pnpm|maven)\.yml)'''
expect = "match"

[[sources]]
url = "https://docs.astral.sh/ruff/linter/"
kind = "docs"
checked = 2026-10-20

[[sources]]
url = "https://eslint.org/docs/latest/use/getting-started"
kind = "docs"
checked = 2026-10-20
