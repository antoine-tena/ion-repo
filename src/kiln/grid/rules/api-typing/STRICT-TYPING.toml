id = "STRICT-TYPING"
title = "A Python type checker runs in strict mode"
pillar = "standards"
theme = "api-typing"
scope = { kind = "language", name = "python" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "Types are the cheapest proof: a wrong call fails before the tests run."
applies = ["python"]
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.1"
charter_rule = "STRICT-TYPING"

[detector]
kind = "regex"
files = ["**/pyproject.toml", "**/mypy.ini", "**/.mypy.ini", "**/setup.cfg", "**/pyrightconfig.json"]
pattern = '''(?m)(^\s*strict\s*=\s*true|typeCheckingMode\"?\s*[:=]\s*\"strict\")'''
expect = "match"

[[sources]]
url = "https://mypy.readthedocs.io/en/stable/"
kind = "docs"
checked = 2026-10-20
