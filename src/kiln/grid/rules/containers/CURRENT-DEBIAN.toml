id = "CURRENT-DEBIAN"
title = "Images built on the current Debian stable (13, trixie)"
pillar = "versions"
theme = "containers"
scope = { kind = "tool", name = "containers" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "An older Debian has left regular security support; images inherit every unfixed package."
applies = ["containers"]
detectable = "script"
fixable = "script"
fixer = "move_to_trixie"
since = "0.4.2"

[detector]
kind = "regex"
files = ["**/Dockerfile", "**/Containerfile", "**/*.Dockerfile", "**/Dockerfile.*"]
pattern = '''(?im)^\s*FROM\s+\S*\b(bookworm|bullseye|buster|stretch)\b'''

[[sources]]
url = "https://www.debian.org/releases/"
kind = "docs"
checked = 2026-10-20
