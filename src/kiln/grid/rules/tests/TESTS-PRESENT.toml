id = "TESTS-PRESENT"
title = "The repo has automated tests"
pillar = "methods"
theme = "tests"
scope = { kind = "universal" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "Without tests no change, by a person or an agent, can be shown to be safe."
applies = []
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.2"

[detector]
kind = "file"
paths = [
    "**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/test/**/*.py",
    "**/*.spec.ts", "**/*.test.ts", "**/*.spec.tsx", "**/*.test.tsx", "**/*.spec.js", "**/*.test.js",
    "**/test/**/*.ts", "**/test/**/*.js", "**/test/**/*.mjs", "**/__tests__/**",
    "**/*_test.go", "**/tests/**/*.rs",
    "**/src/test/**", "**/*Test.java", "**/*Tests.java", "**/*Test.kt", "**/*Test.cs", "**/*Tests.cs",
    "**/*Test.php", "**/tests/**/*.php",
    "**/spec/**/*_spec.rb", "**/test/**/*_test.rb", "**/test/**/*_test.exs", "**/test/**/*_test.dart",
    "**/Tests/**/*.swift", "**/tests/**/*.c", "**/tests/**/*.cpp", "**/test/**/*.c", "**/test/**/*.cpp",
]

[[sources]]
url = "https://docs.pytest.org/en/stable/"
kind = "docs"
checked = 2026-10-20

[[sources]]
url = "https://github.com/ossf/scorecard/blob/main/docs/checks.md"
kind = "advisory"
checked = 2026-10-20
