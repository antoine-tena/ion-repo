id = "TESTS-PRESENT"
title = "The repo has automated tests"
pillar = "methods"
theme = "tests"
scope = { kind = "universal" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "Without tests no change, by a person or an agent, can be shown to be safe."
applies = []
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.2"

[detector]
kind = "file"
paths = ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py", "**/*.spec.ts", "**/*.test.ts", "**/*.spec.js", "**/*.test.js", "**/*_test.go", "**/src/test/**"]

[[sources]]
url = "https://docs.pytest.org/en/stable/"
kind = "docs"
checked = 2026-10-20

[[sources]]
url = "https://github.com/ossf/scorecard/blob/main/docs/checks.md"
kind = "advisory"
checked = 2026-10-20
