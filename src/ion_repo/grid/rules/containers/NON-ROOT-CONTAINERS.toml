id = "NON-ROOT-CONTAINERS"
title = "Container images switch to a non-root user"
pillar = "methods"
theme = "containers"
scope = { kind = "tool", name = "containers" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A process that breaks out of a root container is root on what it reaches; a service rarely needs it."
applies = ["containers"]
fixer = "add_user"
since = "0.4.1"
charter_rule = "HARDENED-CONTAINERS"

[detector]
kind = "python"
check = "non_root_containers"

[[sources]]
url = "https://docs.docker.com/build/building/best-practices/"
kind = "docs"
checked = 2026-10-19
