id = "DJANGO-DEBUG-OFF"
title = "`DEBUG` is never hard-coded to True in the settings that ship"
pillar = "methods"
theme = "app-security"
scope = { kind = "framework", name = "django" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "Debug pages show settings, code and queries to anyone who triggers an error."
applies = ["django"]
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.2"

[detector]
kind = "regex"
files = ["**/settings.py", "**/settings/base.py", "**/settings/prod.py", "**/settings/production.py"]
pattern = '''(?m)^DEBUG\s*=\s*True\b'''

[[sources]]
url = "https://docs.djangoproject.com/en/stable/howto/deployment/checklist/"
kind = "docs"
checked = 2026-10-20
