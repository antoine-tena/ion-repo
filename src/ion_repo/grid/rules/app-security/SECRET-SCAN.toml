id = "SECRET-SCAN"
title = "Commits scanned for secrets, before the push or in CI"
pillar = "methods"
theme = "app-security"
scope = { kind = "universal" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A leaked key is cheapest to catch before it is public."
applies = []
detectable = "script"
fixable = "script"
fixer = "add_secret_scan"
since = "0.4.2"

[detector]
kind = "regex"
files = [".github/workflows/*.yml", ".github/workflows/*.yaml", ".gitlab-ci.yml", ".pre-commit-config.yaml", ".pre-commit-config.yml", ".circleci/config.yml", ".forgejo/workflows/*.yml", "azure-pipelines.yml", "bitbucket-pipelines.yml", "Jenkinsfile"]
pattern = '''(gitleaks|trufflehog|detect-secrets|ggshield|secretlint|kiln check|antoine-tena/kiln/\.github/workflows/secrets\.yml)'''
expect = "match"

[[sources]]
url = "https://github.com/gitleaks/gitleaks"
kind = "docs"
checked = 2026-10-20

[[sources]]
url = "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
kind = "advisory"
checked = 2026-10-20
