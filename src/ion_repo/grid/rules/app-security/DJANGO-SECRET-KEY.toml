id = "DJANGO-SECRET-KEY"
title = "`SECRET_KEY` read from the environment, never written in the settings"
pillar = "methods"
theme = "app-security"
scope = { kind = "framework", name = "django" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "Whoever reads the key can forge sessions and password reset links."
applies = ["django"]
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.2"

[detector]
kind = "regex"
files = ["**/settings.py", "**/settings/base.py", "**/settings/prod.py", "**/settings/production.py"]
pattern = '''(?m)^SECRET_KEY\s*=\s*[rbf]?[\"']'''

[[sources]]
url = "https://docs.djangoproject.com/en/stable/howto/deployment/checklist/"
kind = "docs"
checked = 2026-10-20
