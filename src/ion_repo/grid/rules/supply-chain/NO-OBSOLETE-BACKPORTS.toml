id = "NO-OBSOLETE-BACKPORTS"
title = "No backport of what the standard library has had for years"
pillar = "versions"
theme = "supply-chain"
scope = { kind = "language", name = "python" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "`typing`, `enum34`, `futures`, `pathlib` or `dataclasses` from PyPI shadow the standard library and break installs."
applies = ["python"]
detectable = "script"
fixable = "script"
fixer = "remove_backports"
since = "0.4.2"

[detector]
kind = "regex"
files = ["**/requirements*.txt", "**/pyproject.toml"]
pattern = '''(?im)^\s*[\"']?(typing|enum34|futures|pathlib|dataclasses)\s*([<>=~!;\"',]|$)'''

[[sources]]
url = "https://pypi.org/project/typing/"
kind = "docs"
checked = 2026-10-20
