id = "JS-LINTER"
title = "A JavaScript or TypeScript linter is configured"
pillar = "standards"
theme = "code-standards"
scope = { kind = "language", name = "javascript" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A linter catches the bugs reviewers miss, every time, for free."
applies = ["javascript"]
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.2"

[detector]
kind = "file"
paths = ["**/eslint.config.*", "**/.eslintrc*", "**/biome.json", "**/biome.jsonc", "**/.oxlintrc.json"]

[[sources]]
url = "https://eslint.org/docs/latest/use/getting-started"
kind = "docs"
checked = 2026-10-20
