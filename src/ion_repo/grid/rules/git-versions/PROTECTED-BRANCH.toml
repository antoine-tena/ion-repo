id = "PROTECTED-BRANCH"
title = "The default branch can be neither force-pushed nor deleted"
pillar = "methods"
theme = "git-versions"
scope = { kind = "tool", name = "github" }
level = "adopt"
regime = "strict"
profiles = ["solo", "association", "company", "university", "enterprise"]
why = "A force push or a deletion erases history everyone builds on, and no one can undo it from a clone they never made."
applies = ["github"]
detectable = "script"
fixable = "judgment"
fixer = ""
since = "0.4.10"

[detector]
kind = "python"
check = "protected_branch"

[[sources]]
url = "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-rulesets/available-rules-for-rulesets"
kind = "docs"
checked = 2026-10-26
