# Contrôles d'ion-repo rejoués par git, comme dans les repos générés.
#
# Installation, une fois, à la racine : ion repo install  (ou : uvx pre-commit install)
# Le crochet vaut pour l'arbre principal et tous les worktrees. Tout rejouer :
#   pre-commit run --all-files
# Seulement ruff, sur les fichiers commités : typage, tests et CI ne tournent qu'à la release.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]

