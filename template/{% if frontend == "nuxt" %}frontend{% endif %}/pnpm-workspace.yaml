# Install scripts of dependencies: refused, prebuilt binaries are enough.
allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  unrs-resolver: false
  vue-demi: false

# Exact versions in package.json, even after `kiln update` ([LOCKED-DEPENDENCIES]).
saveExact: true

# `kiln update` does not move these dependencies to a new major: TypeScript 7 breaks vue-tsc 3
# (October 2026). Remove once a vue-tsc release supports it.
updateConfig:
  ignoreDependencies:
    - typescript

# openapi-typescript 7 still declares TypeScript 5 as its peer; it generates the same types with
# TypeScript 6 (checked October 2026). Remove once a release accepts TypeScript 6.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
