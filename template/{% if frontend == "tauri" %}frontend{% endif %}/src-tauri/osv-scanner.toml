# glib 0.18's `VariantStrIter` (RUSTSEC-2024-0429): Tauri 2 builds its Linux window on gtk-rs
# 0.18, which pins it; the fixed glib needs gtk-rs 0.20, which Tauri does not use yet. Compiled for
# Linux only, never for the Windows and macOS installers, and the app does not call that API.
[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2027-05-10
reason = "Linux-only glib 0.18 pinned by Tauri's gtk-rs; not in Windows or macOS builds"

