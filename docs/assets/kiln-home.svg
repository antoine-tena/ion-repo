<text x="181.6" y="95.5" textLength="117.6" fill="#8c8c87">~/code/atelier</text>
<text x="38.8" y="131.5" textLength="42.0" font-weight="bold">Usage</text>
<text x="97.6" y="131.5" textLength="33.6">kiln</text>
<text x="139.6" y="131.5" textLength="159.6" fill="#8c8c87">&lt;command&gt; [options]</text>
<text x="38.8" y="167.5" textLength="58.8" fill="#f79628" font-weight="bold">PROJECT</text>
<text x="55.6" y="185.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">new</text>
<text x="181.6" y="185.5" textLength="260.4">Generate a complete new project</text>
<text x="55.6" y="203.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">adopt</text>
<text x="181.6" y="203.5" textLength="277.2">Bring an existing repo under kiln</text>
<text x="55.6" y="221.5" textLength="58.8" fill="#b9b9b4" font-weight="bold">install</text>
<text x="181.6" y="221.5" textLength="277.2">Set up this machine after a clone</text>
<text x="55.6" y="239.5" textLength="58.8" fill="#b9b9b4" font-weight="bold">publish</text>
<text x="181.6" y="239.5" textLength="462.0">Create the private GitHub repo and protect its branches</text>
<text x="55.6" y="257.5" textLength="50.4" fill="#b9b9b4" font-weight="bold">update</text>
<text x="181.6" y="257.5" textLength="302.4">Update the template and dependencies</text>
<text x="55.6" y="275.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">set</text>
<text x="181.6" y="275.5" textLength="562.8">Show or change the repo's settings (outside a repo: this machine's)</text>
<text x="55.6" y="293.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">waive</text>
<text x="181.6" y="293.5" textLength="487.2">Waive a rule of kiln, or freeze a file (no argument: list)</text>
<text x="38.8" y="329.5" textLength="84.0" fill="#f79628" font-weight="bold">DAY TO DAY</text>
<text x="55.6" y="347.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">dev</text>
<text x="181.6" y="347.5" textLength="193.2">Run the project locally</text>
<text x="55.6" y="365.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">check</text>
<text x="181.6" y="365.5" textLength="201.6">Run the project's checks</text>
<text x="55.6" y="383.5" textLength="16.8" fill="#b9b9b4" font-weight="bold">ci</text>
<text x="181.6" y="383.5" textLength="302.4">Replay a commit's CI on this machine</text>
<text x="55.6" y="401.5" textLength="67.2" fill="#b9b9b4" font-weight="bold">contract</text>
<text x="181.6" y="401.5" textLength="386.4">Regenerate openapi.json and the frontend types</text>
<text x="55.6" y="419.5" textLength="50.4" fill="#b9b9b4" font-weight="bold">doctor</text>
<text x="181.6" y="419.5" textLength="420.0">Diagnose this machine and the repo, with the fixes</text>
<text x="55.6" y="437.5" textLength="84.0" fill="#b9b9b4" font-weight="bold">completion</text>
<text x="181.6" y="437.5" textLength="386.4">Shell completion script (eval it in ~/.bashrc)</text>
<text x="38.8" y="473.5" textLength="67.2" fill="#f79628" font-weight="bold">THE GRID</text>
<text x="55.6" y="491.5" textLength="33.6" fill="#b9b9b4" font-weight="bold">grid</text>
<text x="181.6" y="491.5" textLength="386.4">The rules kiln holds as the best, with sources</text>
<text x="55.6" y="509.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">score</text>
<text x="181.6" y="509.5" textLength="470.4">Any repo measured against the grid, in seconds, no token</text>
<text x="55.6" y="527.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">fix</text>
<text x="181.6" y="527.5" textLength="579.6">Close by script every gap a script can close, on a branch, with proof</text>
<text x="38.8" y="563.5" textLength="75.6" fill="#f79628" font-weight="bold">ALL REPOS</text>
<text x="55.6" y="581.5" textLength="50.4" fill="#b9b9b4" font-weight="bold">status</text>
<text x="181.6" y="581.5" textLength="352.8">State of the kiln repos of the code folder</text>
<text x="55.6" y="599.5" textLength="100.8" fill="#b9b9b4" font-weight="bold">update --all</text>
<text x="181.6" y="599.5" textLength="369.6">Update every kiln repo, merged straight away</text>
<text x="55.6" y="617.5" textLength="58.8" fill="#b9b9b4" font-weight="bold">version</text>
<text x="181.6" y="617.5" textLength="352.8">Versions of kiln: public, candidates, next</text>
<text x="38.8" y="653.5" textLength="67.2" fill="#f79628" font-weight="bold">EXAMPLES</text>
<text x="55.6" y="671.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="671.5" textLength="394.8">kiln new atelier --size ember --backend fastapi</text>
<text x="55.6" y="689.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="689.5" textLength="159.6">kiln update --major</text>
<text x="55.6" y="707.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="707.5" textLength="168.0">kiln set podman=true</text>
<text x="55.6" y="725.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="725.5" textLength="142.8">kiln set --global</text>
<text x="324.4" y="725.5" textLength="210.0"># this machine's settings</text>
<text x="38.8" y="761.5" textLength="176.4" font-weight="bold">kiln &lt;command&gt; --help</text>
<text x="223.6" y="761.5" textLength="386.4" fill="#8c8c87">for the options · github.com/antoine-tena/kiln</text>
</g>
</svg>
