<text x="181.6" y="95.5" textLength="117.6" fill="#8c8c87">~/code/atelier</text>
<text x="38.8" y="131.5" textLength="42.0" font-weight="bold">Usage</text>
<text x="97.6" y="131.5" textLength="67.2">ion-repo</text>
<text x="173.2" y="131.5" textLength="159.6" fill="#8c8c87">&lt;command&gt; [options]</text>
<text x="38.8" y="167.5" textLength="58.8" fill="#f79628" font-weight="bold">PROJECT</text>
<text x="55.6" y="185.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">new</text>
<text x="181.6" y="185.5" textLength="260.4">Generate a complete new project</text>
<text x="55.6" y="203.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">adopt</text>
<text x="181.6" y="203.5" textLength="310.8">Bring an existing repo under ion-repo</text>
<text x="55.6" y="221.5" textLength="58.8" fill="#b9b9b4" font-weight="bold">install</text>
<text x="181.6" y="221.5" textLength="277.2">Set up this machine after a clone</text>
<text x="55.6" y="239.5" textLength="58.8" fill="#b9b9b4" font-weight="bold">publish</text>
<text x="181.6" y="239.5" textLength="462.0">Create the private GitHub repo and protect its branches</text>
<text x="55.6" y="257.5" textLength="50.4" fill="#b9b9b4" font-weight="bold">update</text>
<text x="181.6" y="257.5" textLength="302.4">Update the template and dependencies</text>
<text x="55.6" y="275.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">set</text>
<text x="181.6" y="275.5" textLength="562.8">Show or change the repo's settings (outside a repo: this machine's)</text>
<text x="55.6" y="293.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">waive</text>
<text x="181.6" y="293.5" textLength="520.8">Waive a rule of ion-repo, or freeze a file (no argument: list)</text>
<text x="38.8" y="329.5" textLength="84.0" fill="#f79628" font-weight="bold">DAY TO DAY</text>
<text x="55.6" y="347.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">dev</text>
<text x="181.6" y="347.5" textLength="193.2">Run the project locally</text>
<text x="55.6" y="365.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">check</text>
<text x="181.6" y="365.5" textLength="201.6">Run the project's checks</text>
<text x="55.6" y="383.5" textLength="16.8" fill="#b9b9b4" font-weight="bold">ci</text>
<text x="181.6" y="383.5" textLength="302.4">Replay a commit's CI on this machine</text>
<text x="55.6" y="401.5" textLength="67.2" fill="#b9b9b4" font-weight="bold">contract</text>
<text x="181.6" y="401.5" textLength="386.4">Regenerate openapi.json and the frontend types</text>
<text x="55.6" y="419.5" textLength="50.4" fill="#b9b9b4" font-weight="bold">doctor</text>
<text x="181.6" y="419.5" textLength="420.0">Diagnose this machine and the repo, with the fixes</text>
<text x="55.6" y="437.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">pause</text>
<text x="181.6" y="437.5" textLength="529.2">Keep this Claude Code session's place, listed at the next start</text>
<text x="55.6" y="455.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">frame</text>
<text x="181.6" y="455.5" textLength="478.8">Print the two rules that frame an Ion tool's skill answer</text>
<text x="55.6" y="473.5" textLength="92.4" fill="#b9b9b4" font-weight="bold">eval-skills</text>
<text x="181.6" y="473.5" textLength="520.8">Check that the repo plugin's skills fire (asks three ok first)</text>
<text x="55.6" y="491.5" textLength="84.0" fill="#b9b9b4" font-weight="bold">completion</text>
<text x="181.6" y="491.5" textLength="386.4">Shell completion script (eval it in ~/.bashrc)</text>
<text x="38.8" y="527.5" textLength="67.2" fill="#f79628" font-weight="bold">THE GRID</text>
<text x="55.6" y="545.5" textLength="33.6" fill="#b9b9b4" font-weight="bold">grid</text>
<text x="181.6" y="545.5" textLength="420.0">The rules ion-repo holds as the best, with sources</text>
<text x="55.6" y="563.5" textLength="42.0" fill="#b9b9b4" font-weight="bold">score</text>
<text x="181.6" y="563.5" textLength="470.4">Any repo measured against the grid, in seconds, no token</text>
<text x="55.6" y="581.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">fix</text>
<text x="181.6" y="581.5" textLength="579.6">Close by script every gap a script can close, on a branch, with proof</text>
<text x="55.6" y="599.5" textLength="25.2" fill="#b9b9b4" font-weight="bold">bot</text>
<text x="181.6" y="599.5" textLength="688.8">Kiln-bot's run: ion repo update and ion repo fix on kiln/bot, for one pull request</text>
<text x="38.8" y="635.5" textLength="75.6" fill="#f79628" font-weight="bold">ALL REPOS</text>
<text x="55.6" y="653.5" textLength="50.4" fill="#b9b9b4" font-weight="bold">status</text>
<text x="181.6" y="653.5" textLength="386.4">State of the ion-repo repos of the code folder</text>
<text x="55.6" y="671.5" textLength="100.8" fill="#b9b9b4" font-weight="bold">update --all</text>
<text x="181.6" y="671.5" textLength="403.2">Update every ion-repo repo, merged straight away</text>
<text x="55.6" y="689.5" textLength="58.8" fill="#b9b9b4" font-weight="bold">version</text>
<text x="181.6" y="689.5" textLength="386.4">Versions of ion-repo: public, candidates, next</text>
<text x="38.8" y="725.5" textLength="67.2" fill="#f79628" font-weight="bold">EXAMPLES</text>
<text x="55.6" y="743.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="743.5" textLength="428.4">ion repo new atelier --size small --backend fastapi</text>
<text x="55.6" y="761.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="761.5" textLength="193.2">ion repo update --major</text>
<text x="55.6" y="779.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="779.5" textLength="201.6">ion repo set podman=true</text>
<text x="55.6" y="797.5" textLength="8.4" fill="#5f5f5c">$</text>
<text x="72.4" y="797.5" textLength="176.4">ion repo set --global</text>
<text x="358.0" y="797.5" textLength="210.0"># this machine's settings</text>
<text x="38.8" y="833.5" textLength="210.0" font-weight="bold">ion-repo &lt;command&gt; --help</text>
<text x="257.2" y="833.5" textLength="142.8" fill="#8c8c87">for the options ·</text>
<text x="408.4" y="833.5" textLength="92.4" font-weight="bold">ion-repo -V</text>
<text x="509.2" y="833.5" textLength="386.4" fill="#8c8c87">the version · github.com/antoine-tena/ion-repo</text>
</g>
</svg>
