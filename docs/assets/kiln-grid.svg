<svg xmlns="http://www.w3.org/2000/svg" width="1018" height="1264" viewBox="0 0 1018 1264" role="img" aria-label="kiln grid: the rules kiln stands behind">
<rect width="100%" height="100%" rx="10" fill="#1c1b19"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#e6e3dc" xml:space="preserve">
<text x="22.0" y="41.5" textLength="8.4" fill="#8c8c87">$</text>
<text x="38.8" y="41.5" textLength="75.6">kiln grid</text>
<text x="38.8" y="77.5" textLength="75.6" fill="#f79628" font-weight="bold">STRUCTURE</text>
<text x="55.6" y="95.5" textLength="67.2">REPO-MAP</text>
<text x="248.8" y="95.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="95.5" textLength="571.2">The root instructions hold a map of the repo: where each thing lives</text>
<text x="38.8" y="131.5" textLength="117.6" fill="#f79628" font-weight="bold">CODE-STANDARDS</text>
<text x="55.6" y="149.5" textLength="92.4">BARE-EXCEPT</text>
<text x="248.8" y="149.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="149.5" textLength="142.8">No bare `except:`</text>
<text x="55.6" y="167.5" textLength="75.6">JS-LINTER</text>
<text x="248.8" y="167.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="167.5" textLength="394.8">A JavaScript or TypeScript linter is configured</text>
<text x="55.6" y="185.5" textLength="126.0">NAIVE-DATETIMES</text>
<text x="248.8" y="185.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="185.5" textLength="327.6">No naive `datetime.now()` or `utcnow()`</text>
<text x="55.6" y="203.5" textLength="84.0">NOQA-CODES</text>
<text x="248.8" y="203.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="203.5" textLength="336.0">Each `# noqa` names the rule it silences</text>
<text x="55.6" y="221.5" textLength="109.2">PYTHON-LINTER</text>
<text x="248.8" y="221.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="221.5" textLength="243.6">A Python linter is configured</text>
<text x="38.8" y="257.5" textLength="84.0" fill="#f79628" font-weight="bold">API-TYPING</text>
<text x="55.6" y="275.5" textLength="50.4">NO-ANY</text>
<text x="248.8" y="275.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="275.5" textLength="336.0">No explicit any: unknown, then narrowing</text>
<text x="55.6" y="293.5" textLength="75.6">STRICT-TS</text>
<text x="248.8" y="293.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="293.5" textLength="235.2">TypeScript strict everywhere</text>
<text x="55.6" y="311.5" textLength="109.2">STRICT-TYPING</text>
<text x="248.8" y="311.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="311.5" textLength="344.4">A Python type checker runs in strict mode</text>
<text x="55.6" y="329.5" textLength="126.0">TS-EXPECT-ERROR</text>
<text x="248.8" y="329.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="329.5" textLength="361.2">`@ts-expect-error` rather than `@ts-ignore`</text>
<text x="55.6" y="347.5" textLength="142.8">TYPE-IGNORE-CODES</text>
<text x="248.8" y="347.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="347.5" textLength="352.8">Each `# type: ignore` names its error code</text>
<text x="38.8" y="383.5" textLength="126.0" fill="#f79628" font-weight="bold">DATA-MIGRATIONS</text>
<text x="55.6" y="401.5" textLength="84.0">MIGRATIONS</text>
<text x="248.8" y="401.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="401.5" textLength="470.4">Each Django app with models has its migrations committed</text>
<text x="38.8" y="437.5" textLength="100.8" fill="#f79628" font-weight="bold">APP-SECURITY</text>
<text x="55.6" y="455.5" textLength="168.0">DJANGO-ALLOWED-HOSTS</text>
<text x="248.8" y="455.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="455.5" textLength="352.8">`ALLOWED_HOSTS` names the hosts, never `*`</text>
<text x="55.6" y="473.5" textLength="134.4">DJANGO-DEBUG-OFF</text>
<text x="248.8" y="473.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="473.5" textLength="512.4">`DEBUG` is never hard-coded to True in the settings that ship</text>
<text x="55.6" y="491.5" textLength="142.8">DJANGO-SECRET-KEY</text>
<text x="248.8" y="491.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="491.5" textLength="579.6">`SECRET_KEY` read from the environment, never written in the settings</text>
<text x="55.6" y="509.5" textLength="117.6">NO-TRACKED-ENV</text>
<text x="248.8" y="509.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="509.5" textLength="352.8">No environment file with secrets committed</text>
<text x="55.6" y="527.5" textLength="75.6">NO-V-HTML</text>
<text x="248.8" y="527.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="527.5" textLength="369.6">No `v-html` on content that is not sanitized</text>
<text x="55.6" y="545.5" textLength="92.4">SECRET-SCAN</text>
<text x="248.8" y="545.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="545.5" textLength="445.2">Commits scanned for secrets, before the push or in CI</text>
<text x="55.6" y="563.5" textLength="117.6">SQL-PARAMETERS</text>
<text x="248.8" y="563.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="563.5" textLength="453.6">SQL built with parameters, never by formatting strings</text>
<text x="38.8" y="599.5" textLength="100.8" fill="#f79628" font-weight="bold">SUPPLY-CHAIN</text>
<text x="55.6" y="617.5" textLength="151.2">DEPENDENCY-UPDATES</text>
<text x="248.8" y="617.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="617.5" textLength="445.2">Dependency updates proposed by Dependabot or Renovate</text>
<text x="55.6" y="635.5" textLength="134.4">IMAGES-BY-DIGEST</text>
<text x="248.8" y="635.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="635.5" textLength="319.2">Container base images pinned by digest</text>
<text x="55.6" y="653.5" textLength="159.6">LOCKED-DEPENDENCIES</text>
<text x="248.8" y="653.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="653.5" textLength="529.2">Every dependency manifest has its lockfile committed next to it</text>
<text x="55.6" y="671.5" textLength="176.4">NO-OBSOLETE-BACKPORTS</text>
<text x="248.8" y="671.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="671.5" textLength="487.2">No backport of what the standard library has had for years</text>
<text x="55.6" y="689.5" textLength="117.6">PINNED-ACTIONS</text>
<text x="248.8" y="689.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="689.5" textLength="546.0">GitHub Actions and reusable workflows pinned to a full commit SHA</text>
<text x="55.6" y="707.5" textLength="151.2">SUPPORTED-RUNTIMES</text>
<text x="248.8" y="707.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="707.5" textLength="411.6">Python and Node versions still supported upstream</text>
<text x="55.6" y="725.5" textLength="126.0">UPDATE-COOLDOWN</text>
<text x="248.8" y="725.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="725.5" textLength="537.6">New dependency versions wait a few days before they are proposed</text>
<text x="55.6" y="743.5" textLength="159.6">VULNERABILITY-AUDIT</text>
<text x="248.8" y="743.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="743.5" textLength="436.8">Dependencies audited for known vulnerabilities in CI</text>
<text x="38.8" y="779.5" textLength="42.0" fill="#f79628" font-weight="bold">TESTS</text>
<text x="55.6" y="797.5" textLength="92.4">TESTS-IN-CI</text>
<text x="248.8" y="797.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="797.5" textLength="176.4">The CI runs the tests</text>
<text x="55.6" y="815.5" textLength="109.2">TESTS-PRESENT</text>
<text x="248.8" y="815.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="815.5" textLength="235.2">The repo has automated tests</text>
<text x="38.8" y="851.5" textLength="84.0" fill="#f79628" font-weight="bold">CONTAINERS</text>
<text x="55.6" y="869.5" textLength="117.6">CURRENT-DEBIAN</text>
<text x="248.8" y="869.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="869.5" textLength="453.6">Images built on the current Debian stable (13, trixie)</text>
<text x="55.6" y="887.5" textLength="159.6">HARDENED-CONTAINERS</text>
<text x="248.8" y="887.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="887.5" textLength="646.8">Compose services read-only, every capability dropped, no privilege escalation</text>
<text x="55.6" y="905.5" textLength="159.6">NON-ROOT-CONTAINERS</text>
<text x="248.8" y="905.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="905.5" textLength="352.8">Container images switch to a non-root user</text>
<text x="38.8" y="941.5" textLength="84.0" fill="#f79628" font-weight="bold">OPERATIONS</text>
<text x="55.6" y="959.5" textLength="109.2">HEALTH-PROBES</text>
<text x="248.8" y="959.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="959.5" textLength="277.2">Containers declare a health check</text>
<text x="38.8" y="995.5" textLength="42.0" fill="#f79628" font-weight="bold">CI-CD</text>
<text x="55.6" y="1013.5" textLength="84.0">CI-PRESENT</text>
<text x="248.8" y="1013.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="1013.5" textLength="369.6">A continuous integration runs on each change</text>
<text x="55.6" y="1031.5" textLength="84.0">LINT-IN-CI</text>
<text x="248.8" y="1031.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="1031.5" textLength="184.8">The CI runs the linter</text>
<text x="55.6" y="1049.5" textLength="159.6">PULL-REQUEST-TARGET</text>
<text x="248.8" y="1049.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="1049.5" textLength="680.4">No `pull_request_target` workflow, or one that never runs the pull request's code</text>
<text x="55.6" y="1067.5" textLength="151.2">WORKFLOW-INJECTION</text>
<text x="248.8" y="1067.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="1067.5" textLength="478.8">No untrusted event text expanded inside a workflow script</text>
<text x="55.6" y="1085.5" textLength="168.0">WORKFLOW-PERMISSIONS</text>
<text x="248.8" y="1085.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="1085.5" textLength="394.8">Each workflow sets the permissions of its token</text>
<text x="38.8" y="1121.5" textLength="109.2" fill="#f79628" font-weight="bold">DOCS-TRACKING</text>
<text x="55.6" y="1139.5" textLength="50.4">README</text>
<text x="248.8" y="1139.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="1139.5" textLength="176.4">The repo has a README</text>
<text x="38.8" y="1175.5" textLength="92.4" fill="#f79628" font-weight="bold">AI-ASSISTED</text>
<text x="55.6" y="1193.5" textLength="84.0">AI-CONTEXT</text>
<text x="248.8" y="1193.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="316.0" y="1193.5" textLength="571.2">The repo has instructions for coding agents (CLAUDE.md or AGENTS.md)</text>
<text x="38.8" y="1229.5" textLength="361.2">40 rules, 40 scored (adopt). kiln grid &lt;ID&gt;</text>
<text x="38.8" y="1247.5" textLength="428.4" fill="#8c8c87">95 more, assessed or held: kiln grid --level assess</text>
</g>
</svg>
