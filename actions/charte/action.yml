name: ion repo charter (former name)
description: >-
  Name of `actions/charter` before kiln 0.4.0, kept for the workflows of that time that fall back
  to ion-repo's develop branch. Installs ion-repo with uv (the `ion-repo`, `charter` and `charte` commands).
inputs:
  ref:
    description: Revision of ion-repo to install
    default: develop
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

    - name: ion-repo and charter
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: | # zizmor: ignore[github-env] only uv's own folder joins the PATH
        uv tool install --python 3.14 "git+https://github.com/antoine-tena/ion-repo@${REF}"
        uv tool dir --bin >> "$GITHUB_PATH"
