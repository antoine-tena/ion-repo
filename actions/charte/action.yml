name: kiln charter (former name)
description: >-
  Name of `actions/charter` before kiln 0.4.0, kept for the workflows of that time that fall back
  to kiln's develop branch. Installs kiln with uv (the `kiln`, `charter` and `charte` commands).
inputs:
  ref:
    description: Revision of kiln to install
    default: develop
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    - name: kiln and charter
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: | # zizmor: ignore[github-env] only uv's own folder joins the PATH
        uv tool install --python 3.14 "git+https://github.com/antoine-tena/kiln@${REF}"
        uv tool dir --bin >> "$GITHUB_PATH"
