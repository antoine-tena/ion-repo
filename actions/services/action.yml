name: Test services (podman)
description: >-
  Runs PostgreSQL and, when asked, Redis with podman (never docker), waits until they answer and
  sets DATABASE_URL and REDIS_URL in the environment of the job.
inputs:
  database:
    description: Name of the database, of its user, and prefix of its password
    default: app
  base:
    description: Name before kiln 0.4.0 of `database`
    default: ""
  postgres:
    description: PostgreSQL image (empty = no database)
    default: docker.io/library/postgres:16-alpine
  redis:
    description: Redis image (empty = no Redis)
    default: ""
runs:
  using: composite
  steps:
    - name: PostgreSQL
      if: inputs.postgres != ''
      shell: bash
      env:
        DATABASE: ${{ inputs.base || inputs.database }}
        IMAGE: ${{ inputs.postgres }}
      run: | # zizmor: ignore[github-env] the URL of a service started here
        podman run -d --name ci-postgres -p 5432:5432 \
          -e POSTGRES_USER="$DATABASE" -e POSTGRES_PASSWORD="${DATABASE}_password" \
          -e POSTGRES_DB="$DATABASE" "$IMAGE"
        for _ in $(seq 1 30); do
          podman exec ci-postgres pg_isready -U "$DATABASE" >/dev/null 2>&1 && break
          sleep 2
        done
        podman exec ci-postgres pg_isready -U "$DATABASE"
        url="postgres://${DATABASE}:${DATABASE}_password@localhost:5432/${DATABASE}"
        echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

    - name: Redis
      if: inputs.redis != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.redis }}
      run: | # zizmor: ignore[github-env] the URL of a service started here
        podman run -d --name ci-redis -p 6379:6379 "$IMAGE"
        for _ in $(seq 1 30); do
          podman exec ci-redis redis-cli ping >/dev/null 2>&1 && break
          sleep 2
        done
        podman exec ci-redis redis-cli ping
        echo "REDIS_URL=redis://localhost:6379/1" >> "$GITHUB_ENV"
