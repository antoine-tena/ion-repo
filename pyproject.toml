[project]
# Sur PyPI, `kiln` est pris : la distribution s'appelle kiln-cli, la commande reste `kiln`.
name = "kiln-cli"
version = "0.4.6"
description = "Claude Code's workshop: start every new project, and rescue every old one, like a senior engineer would — even if you're not one."
# README.md, its relative images and links made absolute for PyPI (fancy-pypi-readme, below).
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "antoine-tena" }]
keywords = [
    "copier", "project-template", "scaffolding", "generator", "boilerplate", "uv", "django",
    "nuxt", "fastapi", "github-actions", "claude-code", "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.14"
dependencies = ["copier>=9.4,<10", "packaging>=24"]

[project.urls]
Homepage = "https://github.com/antoine-tena/kiln"
Changelog = "https://github.com/antoine-tena/kiln/blob/develop/CHANGELOG.md"
Issues = "https://github.com/antoine-tena/kiln/issues"

[project.scripts]
kiln = "kiln.cli:main"
# Même commande sous le nom du paquet, pour que `uvx kiln-cli new` marche sans `--from`.
kiln-cli = "kiln.cli:main"
charter = "kiln.charter.cli:run"
# Its name before kiln 0.4.0, still called by adopted repos and older generated ones.
charte = "kiln.charter.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/kiln"]

# Le journal des versions voyage avec l'outil : `kiln update` en montre les nouveautés.
[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "kiln/CHANGELOG.md"

# The commit the tool is built from (`kiln/_build.json`): a folder install says what it is.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# PyPI shows the README away from the repo: each relative image and link points at the release's
# tag on GitHub, where `pypi.yml` publishes from (`tests/test_docs.py` checks they all resolve).
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/antoine-tena/kiln/v$HFPR_VERSION/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)\s]+)\)'
replacement = '](https://github.com/antoine-tena/kiln/blob/v$HFPR_VERSION/\1)'

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Le rendu du modèle (une génération par stack) se répartit sur tous les cœurs. Les tests de
# bout en bout (lents, en réseau) ne tournent que demandés : `uv run pytest -m e2e`.
addopts = "-n auto -m 'not e2e'"
markers = ["e2e: end to end, slow and networked (uv run pytest -m e2e)"]
# A deprecation is a failure to come: it fails the tests now (an escape in copier.yml slipped
# through as a warning).
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Les fichiers du modèle sont vérifiés dans les projets générés (tests et kiln check).
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["copier", "copier.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
